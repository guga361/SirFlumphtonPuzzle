<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitória - Enigma de 20tão do sir flumpthon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Imagens/Sir Flumphton.jpeg">
    <style>
        .victory-container {
            text-align: center;
            padding: 40px;
        }
        .victory-container h1 {
            color: #4ade80;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
        }
        .trophy {
            font-size: 80px;
            margin: 20px 0;
        }
        .victory-container p {
            color: #ccc;
            font-size: 1.3em;
            line-height: 1.8;
        }
        .restart-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vitória!</h1>
        </header>

        <main>
            <div class="victory-container">
                <div class="trophy">🏆</div>
                <h1>Parabéns!</h1>
                <p>Você completou todos os níveis do enigma.</p>
                <p style="margin-top: 15px; color: #888;">Sua inteligência e persistência foram recompensadas.</p>
                <a href="index.html" class="restart-btn">Jogar Novamente</a>
            </div>
        </main>

        <footer>
            <p>© 2026 - Rodrigues Productions</p>
        </footer>
    </div>
</body>
</html>
